name: Remove temporary review automation

on:
  push:
    branches:
      - codex/fix-training-regressions-20260814

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fix-training-regressions-20260814
          fetch-depth: 0

      - name: Remove temporary files and commit
        shell: bash
        run: |
          rm -rf .github/review-patch
          rm -f .github/workflows/apply-review-fixes.yml
          rm -f .github/workflows/apply-review-fixes-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove temporary review automation'
          git push origin HEAD:codex/fix-training-regressions-20260814
